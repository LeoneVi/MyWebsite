name: Test home server

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: DNS diagnostics
        run: |
          echo "=== resolv.conf ==="
          cat /etc/resolv.conf

          echo "=== system DNS ==="
          dig toryleone.com A || true

          echo "=== Cloudflare DNS ==="
          dig @1.1.1.1 toryleone.com A || true

          echo "=== Google DNS ==="
          dig @8.8.8.8 toryleone.com A || true

          echo "=== Quad9 DNS ==="
          dig @9.9.9.9 toryleone.com A || true

          echo "=== authoritative nameservers ==="
          dig toryleone.com NS || true

      - name: Test normal DNS
        continue-on-error: true
        run: |
          curl -vL \
            --connect-timeout 5 \
            --max-time 10 \
            https://toryleone.com \
            -o /tmp/normal.html

      - name: Bypass DNS completely
        run: |
          curl -vL \
            --resolve toryleone.com:443:100.0.29.209 \
            --connect-timeout 5 \
            --max-time 10 \
            https://toryleone.com \
            -o /tmp/direct.html

          grep -i umaring /tmp/direct.html
