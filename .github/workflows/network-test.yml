name: Test home server DNS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show resolver configuration
        run: |
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf

      - name: Test system resolver
        continue-on-error: true
        run: |
          echo "=== SYSTEM RESOLVER ==="
          time dig toryleone.com A

      - name: Test Cloudflare DNS
        continue-on-error: true
        run: |
          echo "=== CLOUDFLARE 1.1.1.1 ==="
          time dig @1.1.1.1 toryleone.com A

      - name: Test Google DNS
        continue-on-error: true
        run: |
          echo "=== GOOGLE 8.8.8.8 ==="
          time dig @8.8.8.8 toryleone.com A

      - name: Test Quad9 DNS
        continue-on-error: true
        run: |
          echo "=== QUAD9 9.9.9.9 ==="
          time dig @9.9.9.9 toryleone.com A

      - name: Test authoritative DNS
        continue-on-error: true
        run: |
          echo "=== NAMESERVERS ==="
          dig toryleone.com NS

      - name: Bypass DNS and reach site directly
        run: |
          curl -vL \
            --resolve toryleone.com:443:100.0.29.209 \
            --connect-timeout 5 \
            --max-time 10 \
            https://toryleone.com \
            -o /tmp/site.html

          echo "=== WEBRING ==="
          grep -i umaring /tmp/site.html
