{{ if .Translations }}

<div class="lang-dropdown">

    <!-- Trigger (current language or icon) -->
    <button class="lang-btn">
        🌐
    </button>

    <!-- Dropdown menu -->
    <div class="lang-menu">

        {{ range .Translations }}
        <a href="{{ .RelPermalink }}" class="lang-item">

            {{ $lang := .Language.Lang }}

            {{ if eq $lang "en" }}
            <img src="/images/flags/us.svg" alt="English" width="24" height="16"/>

            {{ else if eq $lang "pt" }}
            <img src="/images/flags/br.svg" alt="Português" width="24" height="16"/>

            {{ else }}
            <span><s>{{ .Language.LanguageName }}</s></span>
            {{ end }}

        </a>
        {{ end }}

    </div>
</div>

{{ end }}
