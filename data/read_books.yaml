  review: I'm not sure to what extent I can say I've 'read' this book. I can only
    do a handful of the techniques shown in the book, but I wanted to add it to my
    shelf nonetheless.  As much as I'd like to believe it's possible to learn figure
    skating techniques from a book, most of what I have learned has come from advice
    given to me by more experienced skaters at the rink. </br> </br> The T-stop section,
    in particular, left me questioning whether the illustrations always convey proper
    technique. For example, in the figure showing how to do a proper T-Stop, the illustration
    shows the skater extending her arms forward as she is performing the stop. When
    trying to do the T-Stop as shown in the figure and description, an Olympic skater
    who frequents my rink generously gave me feedback on how to do it properly. She
    told me that the last thing a skater should do is extend their arms out while
    performing a T-Stop, because they could easily fall backward and hurt their head.
    She told me to instead place my hands on my hips to keep my body centered, and
    to engage my core. Because of her advice, my T-Stop instantly improved! </br>
    </br> If you want to learn how to skate, you're better off going to the rink and
    learning from people more experienced than you.
  meta:
    title: Ice skating
    author: Karin Künzle-Watson
