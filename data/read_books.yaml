  review: As someone who is fascinated with Victorian culture, I figured a good way
    to learn more about the period would be to read a biography of the most important
    woman of the time. The period's namesake, Queen Victoria. The book starts off
    with the race between King George III's sons to secure an heir to the throne.
    Ironic, because the sons had not produced a legitimate heir because they were
    too busy fooling around with mistresses. This is a stark contrast to the standard
    Queen Victoria would set when she married Prince Albert of Saxe-Coburg. They provided
    England the ideal model for what a strong British Family should look like. Their
    greatest achievement was the opening of the Great Exhibition, showcasing all the
    cutting-edge technological innovations of the time.
