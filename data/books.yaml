    singles who never want to marry, and people who are dating, engaged, or married
    already! Its aim is to shake off the myths and misunderstanding of marriage, and
    offer a clear view of reality: Your partner will change, and so will you. Both
    of you will have to make sacrifices to keep yourself and your partner happy. You
    both need to show acts of love to each other even when you don''t feel "in love,"
    because over time, those feelings can return and deepen.<br/><br/>I couldn''t
    have gotten a better lesson on the meaning of singleness and marriage.'
