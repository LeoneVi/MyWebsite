- title: 'The Rape of Nanking: The Forgotten Holocaust of World War II'
  author: Iris Chang
  review: Before I read this book, I knew little about the Rape of Nanking, aside
    from it being a massacre committed by the Japanese during World War Two. This
    book vividly explained the sheer scale and depravity of this massacre. I now know
    of the Safety Zones, established and protected by heroic Westerners, and the sacrifices
    they made to save thousands of Chinese civilians.  If you're unfamiliar with this
    tragedy, or know little details, I encourage you to read this book so that the
    stories of hundreds of thousands of victims will not be forgotten.
  stars: 5
  finished_dates:
  - 2024/09/09
  cover: https://covers.openlibrary.org/b/isbn/9780140277449-L.jpg?default=false
- title: A Little History of the World
  author: E.H. Gombrich
  review: A great introduction into the subject of history. Each topic is summarized
    briefly, however it lays the foundations for readers to delve into the areas of
    history they found most interesting in the book. I especially appreciated how
    Gombrich ends the book with correcting errors he made in the first release in
    the book, it's a great lesson we as readers need to be critical of information
    we hear.
  stars: 4
