  review: Before I read this book, I knew little about the Rape of Nanking, aside
    from it being a massacre committed by the Japanese during World War Two. This
    book vividly explained the sheer scale and depravity of this massacre. I now know
    of the Safety Zones, established and protected by heroic Westerners, and the sacrifices
    they made to save thousands of Chinese civilians.  If you're unfamiliar with this
    tragedy, or know little details, I encourage you to read this book so that the
    stories of hundreds of thousands of victims will not be forgotten.
