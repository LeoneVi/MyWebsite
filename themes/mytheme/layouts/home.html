{{ define "main" }}
<div class="home-layout">
  <div class="home-main">
    <div class="home-content">{{ .Content }}</div>
    <div class="home-image">
      <img src="{{ .Params.featured_image }}" class="profile-image">
    </div>
  </div>

  <div class="web-ring">
    <div id="umaring"></div>
  </div>
</div>

{{ $webringJS := resources.Get "js/webring.js" | js.Build }}
<script src="{{ $webringJS.RelPermalink }}" defer></script>
{{ end }}
