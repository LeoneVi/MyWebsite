baseURL: https://toryleone.com/
locale: en-us
title: 'Tory''s Website'
theme : 'mytheme'

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true

# Add both date formats to each future language. The article format is
# localized automatically; numeric list formats use Go's reference date.
languages:
  en:
    params:
      languageName: "English"
      listDateFormat: "01/02/2006"
      articleDateFormat: ":date_long"
    weight: 1

  pt:
    params:
      languageName: "Português"
      listDateFormat: "02/01/2006"
      articleDateFormat: ":date_long"
    weight: 2
